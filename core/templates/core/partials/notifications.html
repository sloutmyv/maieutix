<!-- Système de notifications toast -->
<div id="notification-container" 
     class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 space-y-2"
     x-data="notificationSystem()"
     @notification.window="addNotification($event.detail)">
    
    <template x-for="notification in notifications" :key="notification.id">
        <div x-show="notification.visible"
             x-transition:enter="transform ease-out duration-300 transition"
             x-transition:enter-start="scale-50 opacity-0"
             x-transition:enter-end="scale-100 opacity-100"
             x-transition:leave="transform ease-in duration-200 transition"
             x-transition:leave-start="scale-100 opacity-100"
             x-transition:leave-end="scale-50 opacity-0"
             class="min-w-96 max-w-md w-full bg-white shadow-lg rounded-lg pointer-events-auto ring-1 ring-black ring-opacity-5 overflow-hidden">
            
            <div class="p-4">
                <div class="flex items-start">
                    <!-- Icône selon le type -->
                    <div class="flex-shrink-0">
                        <!-- Success -->
                        <div x-show="notification.type === 'success'" class="w-6 h-6">
                            <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <!-- Error -->
                        <div x-show="notification.type === 'error'" class="w-6 h-6">
                            <svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <!-- Warning -->
                        <div x-show="notification.type === 'warning'" class="w-6 h-6">
                            <svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                        </div>
                        <!-- Info -->
                        <div x-show="notification.type === 'info'" class="w-6 h-6">
                            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                    </div>
                    
                    <!-- Message -->
                    <div class="ml-3 w-0 flex-1 pt-0.5">
                        <p class="text-sm font-medium text-gray-900" x-text="notification.message"></p>
                    </div>
                    
                    <!-- Bouton fermer -->
                    <div class="ml-4 flex-shrink-0 flex">
                        <button @click="removeNotification(notification.id)"
                                class="bg-white rounded-md inline-flex text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
function notificationSystem() {
    return {
        notifications: [],
        nextId: 1,
        
        addNotification(details) {
            const notification = {
                id: this.nextId++,
                message: details.message,
                type: details.type || 'info',
                visible: true
            };
            
            this.notifications.push(notification);
            
            // Auto-suppression après 5 secondes
            setTimeout(() => {
                this.removeNotification(notification.id);
            }, 5000);
        },
        
        removeNotification(id) {
            const index = this.notifications.findIndex(n => n.id === id);
            if (index > -1) {
                this.notifications[index].visible = false;
                // Supprimer de la liste après l'animation
                setTimeout(() => {
                    this.notifications.splice(index, 1);
                }, 300);
            }
        }
    }
}

// Fonction globale pour déclencher des notifications
window.showNotification = function(message, type = 'info') {
    window.dispatchEvent(new CustomEvent('notification', {
        detail: { message, type }
    }));
};
</script>
