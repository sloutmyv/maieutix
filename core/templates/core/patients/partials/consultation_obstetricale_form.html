{% comment %}
Formulaire de consultation obstétricale - Version prototype UI
{% endcomment %}

<div class="obstetricale-form border border-gray-200 rounded-lg p-4">
    <form id="consultation-obstetricale-form" class="space-y-4">
        <h6 class="text-sm font-semibold text-gray-900 mb-3 border-b border-gray-200 pb-2">
            📋 Nouvelle consultation obstétricale
        </h6>
        
        <!-- Informations générales -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Date de consultation</label>
                <input type="date" 
                       class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       value="{% now 'Y-m-d' %}" max="{% now 'Y-m-d' %}">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">SA (Semaines d'Aménorrhée)</label>
                <input type="text" 
                       class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="ex: 24+3">
            </div>
        </div>

        <!-- Constantes vitales -->
        <div class="constantes-grid border border-gray-100 rounded p-3">
            <h6 class="text-xs font-semibold text-gray-900 mb-2">Constantes vitales</h6>
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Poids (kg)</label>
                    <input type="number" step="0.1" min="30" max="200"
                           class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                           placeholder="65.5">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Tension systolique</label>
                    <input type="number" min="80" max="250"
                           class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                           placeholder="120">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Tension diastolique</label>
                    <input type="number" min="40" max="150"
                           class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                           placeholder="80">
                </div>
            </div>
        </div>

        <!-- Mesures obstétricales -->
        <div class="bg-white border border-gray-100 rounded p-3">
            <h6 class="text-xs font-semibold text-gray-900 mb-2">Mesures obstétricales</h6>
            <div class="grid grid-cols-4 gap-3">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">HU (cm)</label>
                    <input type="number" min="0" max="50"
                           class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                           placeholder="24">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Présentation</label>
                    <select class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        <option value="">--</option>
                        <option value="cephalique">Céphalique</option>
                        <option value="siege">Siège</option>
                        <option value="transverse">Transverse</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">BCF (bpm)</label>
                    <input type="number" min="100" max="180"
                           class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                           placeholder="140">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Mouvements actifs</label>
                    <select class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                        <option value="oui">Oui</option>
                        <option value="non">Non</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Examen clinique -->
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Examen clinique</label>
                <textarea rows="3"
                          class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                          placeholder="Examen général, palpation abdominale, auscultation cardiaque fœtale..."></textarea>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Examens complémentaires</label>
                <textarea rows="2"
                          class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                          placeholder="Échographie, prélèvements, analyses biologiques..."></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Prescriptions</label>
                <textarea rows="3"
                          class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                          placeholder="Médicaments, examens à prévoir, recommandations..."></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">Notes et observations</label>
                <textarea rows="2"
                          class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:ring-2 focus:ring-blue-500"
                          placeholder="Notes particulières, rendez-vous de suivi..."></textarea>
            </div>
        </div>

        <!-- Boutons d'action -->
        <div class="flex justify-between pt-3 border-t border-gray-200">
            <button type="button" 
                    onclick="document.getElementById('consultation-obstetricale-form-container').classList.add('hidden')"
                    class="px-3 py-1 text-sm text-gray-600 border border-gray-300 rounded hover:bg-gray-50">
                Annuler
            </button>
            <button type="submit"
                    style="background-color: #3B82F6;"
                    class="px-4 py-1 text-sm text-white rounded hover:opacity-90">
                Sauvegarder
            </button>
        </div>
    </form>
</div>
