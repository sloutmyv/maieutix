{% comment %}
Données médicales de grossesse - Interface compacte avec 3 sections
{% endcomment %}

<div class="space-y-3" id="donnees-grossesse-container-{{ patient.id }}">
    <form id="donnees-grossesse-form-{{ patient.id }}">
        {% csrf_token %}
        <input type="hidden" name="patient_id" value="{{ patient.id }}">
        
        <!-- Section 1: Obstétrique -->
        <div class="bg-gray-100 rounded-lg p-2 border border-gray-300">
            <h6 class="text-xs font-semibold text-gray-800 mb-2 pb-1 border-b border-gray-300">Obstétrique</h6>
            <div class="grid grid-cols-12 gap-2 text-xs">
                <div class="col-span-2">
                    <label class="block text-gray-600 font-medium mb-1">G/P</label>
                    <input type="text" name="gestite_parite" value="{{ donnees.gestite_parite|default:'' }}" placeholder="G3P2"
                           class="w-full px-2 py-1 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                           onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                </div>
                <div class="col-span-5">
                    <label class="block text-gray-600 font-medium mb-1">Facteurs de risque</label>
                    <input type="text" name="facteurs_risque" value="{{ donnees.facteurs_risque|default:'' }}" placeholder="Facteurs identifiés"
                           class="w-full px-2 py-1 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                           onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                </div>
                <div class="col-span-5">
                    <label class="block text-gray-600 font-medium mb-1">Lieu accouchement</label>
                    <input type="text" name="lieu_accouchement" value="{{ donnees.lieu_accouchement|default:'' }}" placeholder="Hôpital, clinique..."
                           class="w-full px-2 py-1 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                           onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                </div>
            </div>
        </div>
        
        <!-- Section 2: Sérologies & Dépistages -->
        <div class="bg-gray-100 rounded-lg p-2 border border-gray-300">
            <h6 class="text-xs font-semibold text-gray-800 mb-2 pb-1 border-b border-gray-300">Sérologies & Dépistages</h6>
            
            <!-- Ligne 1: 5 premiers éléments -->
            <div class="grid grid-cols-5 gap-2 text-xs">
                <div>
                    <label class="block text-gray-600 font-medium mb-1">GS Rh</label>
                    <select name="gs_rh" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="A+" {% if donnees.gs_rh == "A+" %}selected{% endif %}>A+</option>
                        <option value="A-" {% if donnees.gs_rh == "A-" %}selected{% endif %}>A-</option>
                        <option value="B+" {% if donnees.gs_rh == "B+" %}selected{% endif %}>B+</option>
                        <option value="B-" {% if donnees.gs_rh == "B-" %}selected{% endif %}>B-</option>
                        <option value="AB+" {% if donnees.gs_rh == "AB+" %}selected{% endif %}>AB+</option>
                        <option value="AB-" {% if donnees.gs_rh == "AB-" %}selected{% endif %}>AB-</option>
                        <option value="O+" {% if donnees.gs_rh == "O+" %}selected{% endif %}>O+</option>
                        <option value="O-" {% if donnees.gs_rh == "O-" %}selected{% endif %}>O-</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">RAI</label>
                    <select name="rai" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Négatif" {% if donnees.rai == "Négatif" %}selected{% endif %}>Nég</option>
                        <option value="Positif" {% if donnees.rai == "Positif" %}selected{% endif %}>Pos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">HT21</label>
                    <input type="text" name="ht21" value="{{ donnees.ht21|default:'' }}" placeholder="1/250"
                           class="w-full px-2 py-1 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                           onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">DPNI</label>
                    <select name="dpni" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Négatif" {% if donnees.dpni == "Négatif" %}selected{% endif %}>Nég</option>
                        <option value="Positif" {% if donnees.dpni == "Positif" %}selected{% endif %}>Pos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">Toxo</label>
                    <select name="toxo" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Immune" {% if donnees.toxo == "Immune" %}selected{% endif %}>Imm</option>
                        <option value="Non immune" {% if donnees.toxo == "Non immune" %}selected{% endif %}>Non</option>
                        <option value="À refaire" {% if donnees.toxo == "À refaire" %}selected{% endif %}>Ref</option>
                    </select>
                </div>
            </div>
            
            <!-- Ligne 2: 5 derniers éléments -->
            <div class="grid grid-cols-5 gap-2 mt-2 text-xs">
                <div>
                    <label class="block text-gray-600 font-medium mb-1">Rub</label>
                    <select name="rub" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Immune" {% if donnees.rub == "Immune" %}selected{% endif %}>Imm</option>
                        <option value="Non immune" {% if donnees.rub == "Non immune" %}selected{% endif %}>Non</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">VIH</label>
                    <select name="vih" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Négatif" {% if donnees.vih == "Négatif" %}selected{% endif %}>Nég</option>
                        <option value="Positif" {% if donnees.vih == "Positif" %}selected{% endif %}>Pos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">TPHA</label>
                    <select name="tpha_vdrl" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Négatif" {% if donnees.tpha_vdrl == "Négatif" %}selected{% endif %}>Nég</option>
                        <option value="Positif" {% if donnees.tpha_vdrl == "Positif" %}selected{% endif %}>Pos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">Ag HBs</label>
                    <select name="ag_hbs" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Négatif" {% if donnees.ag_hbs == "Négatif" %}selected{% endif %}>Nég</option>
                        <option value="Positif" {% if donnees.ag_hbs == "Positif" %}selected{% endif %}>Pos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">Ac HBs</label>
                    <select name="ac_anti_hbs" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="< 10 UI/L" {% if donnees.ac_anti_hbs == "< 10 UI/L" %}selected{% endif %}><10</option>
                        <option value=">= 10 UI/L" {% if donnees.ac_anti_hbs == ">= 10 UI/L" %}selected{% endif %}>≥10</option>
                        <option value=">= 100 UI/L" {% if donnees.ac_anti_hbs == ">= 100 UI/L" %}selected{% endif %}>≥100</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Section 3: Analyses complémentaires -->
        <div class="bg-gray-100 rounded-lg p-2 border border-gray-300">
            <h6 class="text-xs font-semibold text-gray-800 mb-2 pb-1 border-b border-gray-300">Analyses complémentaires</h6>
            <div class="grid grid-cols-8 gap-2 text-xs">
                <div>
                    <label class="block text-gray-600 font-medium mb-1">Glyc jeun</label>
                    <input type="text" name="glyc_jeun" value="{{ donnees.glyc_jeun|default:'' }}" placeholder="0.85 g/L"
                           class="w-full px-2 py-1 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                           onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">HGPO</label>
                    <input type="text" name="hgpo" value="{{ donnees.hgpo|default:'' }}" placeholder="T0-T1-T2"
                           class="w-full px-2 py-1 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                           onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">Hb</label>
                    <input type="text" name="hb" value="{{ donnees.hb|default:'' }}" placeholder="12.5 g/dL"
                           class="w-full px-2 py-1 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                           onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">Plaquettes</label>
                    <input type="text" name="plaq" value="{{ donnees.plaq|default:'' }}" placeholder="250 000/mm³"
                           class="w-full px-2 py-1 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                           onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">PV</label>
                    <select name="pv" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Normal" {% if donnees.pv == "Normal" %}selected{% endif %}>Normal</option>
                        <option value="Streptocoque B+" {% if donnees.pv == "Streptocoque B+" %}selected{% endif %}>SB+</option>
                        <option value="Streptocoque B-" {% if donnees.pv == "Streptocoque B-" %}selected{% endif %}>SB-</option>
                        <option value="Mycose" {% if donnees.pv == "Mycose" %}selected{% endif %}>Mycose</option>
                        <option value="Infection" {% if donnees.pv == "Infection" %}selected{% endif %}>Infection</option>
                        <option value="À refaire" {% if donnees.pv == "À refaire" %}selected{% endif %}>À refaire</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">ECBU</label>
                    <select name="ecbu" class="w-full px-2 py-2 border border-gray-300 rounded text-xs focus:ring-1 focus:ring-blue-500" 
                            onchange="saveDonneesGrossesse({{ patient.id }}); applyMedicalColorCoding({{ patient.id }});">
                        <option value="">--</option>
                        <option value="Normal" {% if donnees.ecbu == "Normal" %}selected{% endif %}>Normal</option>
                        <option value="Infection" {% if donnees.ecbu == "Infection" %}selected{% endif %}>Infection</option>
                        <option value="Leucocytes+" {% if donnees.ecbu == "Leucocytes+" %}selected{% endif %}>Leucocytes+</option>
                        <option value="Protéines+" {% if donnees.ecbu == "Protéines+" %}selected{% endif %}>Protéines+</option>
                        <option value="Nitrites+" {% if donnees.ecbu == "Nitrites+" %}selected{% endif %}>Nitrites+</option>
                        <option value="À refaire" {% if donnees.ecbu == "À refaire" %}selected{% endif %}>À refaire</option>
                    </select>
                </div>
                <!-- Colonnes vides -->
                <div class="col-span-2"></div>
            </div>
        </div>
    </form>
    
    <!-- Légende des couleurs -->
    <div class="flex justify-center items-center space-x-4 text-xs text-gray-600 mt-2">
        <div class="flex items-center">
            <div class="w-3 h-3 bg-green-50 border border-green-300 rounded mr-1"></div>
            <span>Normal</span>
        </div>
        <div class="flex items-center">
            <div class="w-3 h-3 bg-orange-50 border border-orange-300 rounded mr-1"></div>
            <span>Surveillance</span>
        </div>
        <div class="flex items-center">
            <div class="w-3 h-3 bg-red-50 border border-red-300 rounded mr-1"></div>
            <span>Alerte</span>
        </div>
    </div>
    
    <!-- Statut de sauvegarde -->
    <div id="donnees-grossesse-status-{{ patient.id }}" class="text-xs text-center min-h-4"></div>
</div>
