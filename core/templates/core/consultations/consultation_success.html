<!-- Message de succès après ajout consultation -->
<div class="p-4">
    <div class="flex items-center justify-center mb-3">
        <div class="flex items-center justify-center w-8 h-8 bg-green-100 rounded-full">
            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
    </div>
    
    <div class="text-center">
        <h3 class="text-sm font-medium text-gray-900 mb-2">Consultation enregistrée</h3>
        <p class="text-xs text-gray-600 mb-1">{{ patient.nom_complet }}</p>
        <p class="text-xs text-gray-500">{{ consultation.date_consultation|date:"d/m/Y" }} - {{ consultation.motif|truncatechars:30 }}</p>
    </div>
    
    <div class="mt-4 flex justify-center">
        <button type="button" 
                onclick="document.getElementById('consultation-form-container').classList.add('hidden'); document.getElementById('consultation-form-container').innerHTML = ''; window.dispatchEvent(new CustomEvent('consultation-added'))"
                class="px-3 py-1.5 text-xs font-medium text-white rounded"
                style="background-color: #2D4B73;">
            Fermer
        </button>
    </div>
</div>
