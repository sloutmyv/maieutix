<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Code
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Libellé
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Convention actuel
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Actions
                </th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for acte in actes %}
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-medium text-gray-900">
                        {{ acte.code }}
                    </div>
                </td>
                <td class="px-6 py-4">
                    <div class="text-sm text-gray-900">
                        {{ acte.libelle|truncatechars:80 }}
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    {% if acte.tarif_actuel %}
                        <span class="inline-flex items-center px-2 py-1 text-sm font-medium rounded-full bg-green-100 text-green-800">
                            {{ acte.tarif_actuel.cout_xpf }} XPF
                        </span>
                    {% else %}
                        <span class="inline-flex items-center px-2 py-1 text-sm font-medium rounded-full bg-red-100 text-red-800">
                            Pas de tarif
                        </span>
                    {% endif %}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <div class="flex space-x-2">
                        <button 
                            hx-get="{% url 'administration:acte_detail' acte.pk %}"
                            hx-target="#modal-container"
                            hx-swap="innerHTML"
                            style="color: #2D4B73;"
                            class="hover:opacity-70 transition-opacity"
                            title="Voir les détails et tarifs"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                        <button 
                            hx-get="{% url 'administration:acte_update' acte.pk %}"
                            hx-target="#modal-container"
                            hx-swap="innerHTML"
                            style="color: #2D4B73;"
                            class="hover:opacity-70 transition-opacity"
                            title="Modifier"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                        </button>
                        <button 
                            hx-delete="{% url 'administration:acte_delete' acte.pk %}"
                            hx-confirm="Êtes-vous sûr de vouloir supprimer l'acte {{ acte.code }} ?"
                            hx-target="closest tr"
                            hx-swap="outerHTML swap:1s"
                            class="text-red-600 hover:text-red-800 transition-colors"
                            title="Supprimer"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="px-6 py-4 text-center text-gray-500">
                    Aucun acte trouvé
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
